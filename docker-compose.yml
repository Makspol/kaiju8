services:
  backend:
    build:
      context: ./backend
    environment:
      KAIJU8_DB_PATH: /data/kaiju8.db
    ports:
      - "8000:8000"
    volumes:
      - kaiju8_data:/data

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  kaiju8_data:
